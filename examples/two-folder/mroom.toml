# A Laravel API and a separate Vite SPA in two folders of one repository.
# Every value here is made up; copy it and change what differs.

[app]
name = "bookings"
backend_dir = "api"
frontend_dir = "web"
package_manager = "pnpm"
php = "8.4"
version_path = "/version"

[app.build]
frontend = "pnpm build"
after_deploy = ["config:clear", "route:cache"]
daemons = ["horizon", "reverb"]
queues = ["default", "mail"]

# What Laravel Echo reads. In QA, mroom gives the pull request's Reverb app key and the box's Reverb host, port and
# scheme.
[app.build.frontend_env]
VITE_REVERB_APP_KEY = "env:REVERB_APP_KEY"
VITE_REVERB_HOST = "env:REVERB_HOST"
VITE_REVERB_PORT = "env:REVERB_PORT"
VITE_REVERB_SCHEME = "env:REVERB_SCHEME"

[tests]
command = "php artisan test --compact --parallel"
database_pattern = "{app}_{slug}_testing"
suites_glob = "app/*/Tests"

[issues]
tracker = "linear"
id_pattern = "BK-[0-9]+"
url = "https://linear.app/example/issue/{id}"

[pr]
required_checks = ["test", "lint", "e2e", "check-title"]

[qa]
zone = "qa.example.dev"
max_envs = 5                # at most: the box's memory may hold fewer
env_memory_mb = 1536        # one environment: PHP-FPM, its queue worker, its share of Postgres and Redis
ttl_days = 5
template_database = "qa_template"
persona_domain = ".test"
db_read_allowlist = ["users.email", "users.name"]

[qa.parity]
database = "seeded"
mail = "catcher"
broadcast = "same"
files = "same"

[persona]
name = "Agent"
