# mroom template (copied once by `mroom init`; the app owns it from then on). Placeholders: README, "CI templates".
name: Setup frontend
description: >-
  Node, the package manager and the frontend's dependencies, from the package store that
  ci-cache-warm.yml saves on the default branch. Restore only: setup-node's own `cache:` option would
  save a cache from every pull request, which helps only that PR and fills the store (design section 10,
  pattern 1).

inputs:
  install:
    description: "'false' to set up Node and the package manager without installing the frontend's dependencies"
    default: 'true'
  store:
    description: "'false' to leave the package store alone (ci-cache-warm.yml restores and saves it itself)"
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      if: ${{ '<<app.package_manager>>' == 'pnpm' }}
      uses: pnpm/action-setup@v6
      with:
        run_install: false
        package_json_file: <<app.frontend_dir>>/package.json

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: <<fill:node_version>>
        # Newer setup-node versions cache by themselves when package.json names its package manager,
        # and that cache saves from pull requests too.
        package-manager-cache: false

    - name: Find the package store
      if: inputs.store == 'true'
      id: store
      shell: bash
      working-directory: <<app.frontend_dir>>
      run: echo "dir=$(<<pm.store_path>>)" >> "$GITHUB_OUTPUT"

    # The same path and key as ci-cache-warm.yml, which saves it: a different string never restores.
    - name: Restore the package store
      if: inputs.store == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.dir }}
        key: ${{ runner.os }}-node-store-${{ hashFiles('<<app.frontend_dir>>/<<pm.lockfile>>', '<<app.backend_dir>>/<<pm.lockfile>>') }}
        restore-keys: ${{ runner.os }}-node-store-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: <<app.frontend_dir>>
      run: <<pm.install>>
