name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: shellcheck and py_compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every shell script
        run: |
          mapfile -t files < <(git ls-files | xargs awk 'FNR == 1 && /^#!.*[ \/](ba)?sh$/ { print FILENAME; nextfile }')
          printf '%s\n' "${files[@]}"
          shellcheck --version | head -2
          shellcheck -x "${files[@]}"
      - name: py_compile
        # Every .py file, and every script whose shebang runs python3 (lib/site-op).
        run: |
          { git ls-files '*.py'; git ls-files | xargs awk 'FNR == 1 && /^#!.*python3/ { print FILENAME; nextfile }'; } \
            | sort -u | tee /dev/stderr | xargs python3 -m py_compile
      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME but VERSION says $want"; exit 1; }

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash --version | head -1 && python3 --version
      - run: tests/run.sh

  gate-postgres:
    # The gate against the runner's own Postgres, set up as the README says: pg_hba.conf, ownership and
    # one environment never reaching another's database, which the offline fake cannot show.
    name: gate on a real Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/pg/gate-real-test.sh

  gate-redis:
    # The gate against a real Redis in Docker, set up as the README says: each environment's user keeps to
    # its prefix, passwords rotate, users survive a restart and redis-clear deletes only the prefix's keys.
    # Redis 8 bundles module commands that take no keys; 7 has none.
    name: gate on a real Redis ${{ matrix.redis }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.4", "8"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/redis/gate-real-test.sh
        env:
          MROOM_TEST_REDIS_IMAGE: redis:${{ matrix.redis }}

  gate-sites:
    # The gate's site operations with real users, sudo and a PHP-FPM pool, set up as the README says: a box
    # user holding only the sudoers line, Forge-style isolated users and a root-owned site-op.
    name: gate on real site users
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP-FPM
        run: |
          if ! compgen -G '/usr/sbin/php-fpm*' >/dev/null; then
            sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q php-fpm
          fi
      - run: tests/site/gate-real-test.sh

  gate-sites-sudo-rs:
    # The same with sudo-rs, which newer Ubuntu releases ship as sudo: Ubuntu 26.04 in a container, as root.
    name: gate on real site users (sudo-rs)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - name: packages
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates git python3 php-cli php-fpm procps sudo-rs
          command -v sudo >/dev/null || ln -s /usr/lib/cargo/bin/sudo /usr/local/bin/sudo
          if [ ! -e /etc/sudoers ]; then
            printf 'Defaults env_reset\nDefaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"\nroot ALL=(ALL:ALL) ALL\n@includedir /etc/sudoers.d\n' >/etc/sudoers
            chmod 440 /etc/sudoers
          fi
          mkdir -p /etc/sudoers.d
          sudo --version | head -n 1 | grep -q sudo-rs
      - uses: actions/checkout@v4
      - run: tests/site/gate-real-test.sh

  gate-mail:
    # The gate's mail operations against the real Mailpit, which mroom baseline mailpit downloads at its
    # pinned build and checks: logins, restarts, reading and clearing one environment's mail.
    name: gate on a real Mailpit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/mail/gate-real-test.sh

  install:
    # Phase 0 "done when": install.sh on a fresh Ubuntu installs mroom and `mroom config get app.name`
    # reads an example. A bare ubuntu:24.04 container is the fresh box.
    name: install on fresh Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: install.sh names what a bare box is missing
        run: |
          if ./install.sh 2> err.txt; then echo "install.sh should refuse a bare box"; exit 1; fi
          cat err.txt
          grep -q -- '- python3 >= 3.11' err.txt
          grep -q -- '- jq' err.txt
          grep -q -- '- git' err.txt
      - name: host requirements
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends python3 jq git
      - name: install.sh
        run: ./install.sh && ./install.sh
      - name: mroom config get app.name reads the examples
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mroom version
          test "$(mroom version)" = "$(cat VERSION)"
          test "$(cd examples/single-app && mroom config get app.name)" = shop
          test "$(cd examples/two-folder && mroom config get app.name)" = bookings
          (cd examples/two-folder && mroom config validate)
