name: privacy

# A pull request's added lines, paths, commit messages, title and body against the owner's private words
# (tools/privacy_check.py, README "Privacy check"). The list is the secret MROOM_PRIVATE_WORDS, one
# case-insensitive regular expression per line. A hit names its place and the entry's number, never the word.
#
# The job holds the secret, so it never runs the pull request's code. pull_request_target runs the default
# branch's copy of this file, never the pull request's; the check script comes from a checkout of the default
# branch (base/), and the pull request's head is checked out apart (pr/) as data only: git reads it, nothing in it
# runs. The script runs with python3 -I, so nothing in pr/ is imported. Each entry is masked before the check runs,
# and nothing here traces commands (no set -x). With no secret the check passes with a notice. A fork's pull
# request is checked too; it is only read.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the check, from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          persist-credentials: false
          sparse-checkout: /tools/privacy_check.py
          sparse-checkout-cone-mode: false
      - name: the pull request, as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: private words
        env:
          WORDS: ${{ secrets.MROOM_PRIVATE_WORDS }}
        run: |
          [ -n "$WORDS" ] || exit 0
          while IFS= read -r word; do
            word="${word%$'\r'}"
            word="${word#"${word%%[![:space:]]*}"}"
            word="${word%"${word##*[![:space:]]}"}"
            [ -z "$word" ] || printf '::add-mask::%s\n' "$word"
          done <<<"$WORDS"
          list="$RUNNER_TEMP/private-words"
          (umask 077 && printf '%s\n' "$WORDS" >"$list")
          printf 'MROOM_PRIVATE_WORDS=%s\n' "$list" >>"$GITHUB_ENV"
      - name: check the pull request
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I ../base/tools/privacy_check.py --base "$BASE_SHA" --head HEAD
