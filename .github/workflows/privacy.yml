name: privacy

# A pull request's paths, added lines, commits (author, committer, message), title, body and branch name against
# the owner's private words (tools/privacy_check.py, README "Privacy check"). The list is the secret
# MROOM_PRIVATE_WORDS of the privacy environment, which admits the default branch alone; one case-insensitive
# regular expression per line. A hit names its place and the entry's number, never the word.
#
# The job holds the secret, so it never runs the pull request's code. pull_request_target runs the default
# branch's copy of this file, whatever the pull request's base (GitHub's rule since December 2025), and the
# privacy environment admits only a run from the default branch. The job also skips a pull request based on
# another branch, so a pull request is only ever checked against the default branch. The script comes from this
# file's own commit (base/), run with python3 -I. The pull request is fetched by its two commits into a bare
# repository (pr.git): git reads it as data, and no working tree, hook or attribute of it is used. The script
# masks each entry before it prints anything, and nothing here traces commands (no set -x). With no secret the
# check passes with a notice.
#
# A fork's pull request is not checked, nor one whose author is not the repository's owner, a member or a
# collaborator (OWNER, MEMBER or COLLABORATOR): its annotations are public, so anyone could test guesses against
# the list. The owner runs tools/privacy_check.py on it before merging (README). Dependabot's runs get no
# secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: privacy
      deployment: false
    steps:
      - name: the check, at this file's commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: base
          persist-credentials: false
          sparse-checkout: /tools/privacy_check.py
          sparse-checkout-cone-mode: false
      - name: the pull request, as data
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q --bare pr.git
          git -C pr.git fetch -q --no-tags "$REPO" "$BASE_SHA" "$HEAD_SHA"
      - name: check the pull request
        working-directory: pr.git
        env:
          MROOM_PRIVATE_WORDS: ${{ secrets.MROOM_PRIVATE_WORDS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 -I ../base/tools/privacy_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
