name: QA plan

# The half of a pull request's QA environment that runs the pull request's code, so it holds no secret (design 8.2).
# The app calls this workflow from one of its own on pull_request and workflow_dispatch (README, QA environments).
# Its first job reads the pull request's head commit, and the build job, named after that commit, sorts the changed
# paths (actions/qa-plan), before any of the pull request's code runs, into the run's summary; then it builds the
# frontend with public values only (actions/qa-plan/build.sh), for <N>.<zone>, or for api.<N>.<zone> when Vite builds
# inside the Laravel app, and keeps it as the mroom-qa-dist artifact. When this run completes, qa-up starts
# (workflow_run), which runs the default branch's workflow and mroom's actions at their pinned commit, takes the
# build as data to copy and sorts the paths again itself, since nothing a run of the pull request's code leaves can
# be trusted. Only qa-up uses the qa environment, which admits the default branch alone.
#
# A run started with the job token, as a wake starts it for a pull request that waited for a slot, starts no
# workflow_run when it ends: the hand-over job then starts the app's qa-up workflow itself, naming this run. The
# qa-up run it starts ends without a workflow_run too, so qa-up starts whatever follows it in the same way.
on:
  workflow_call:
    inputs:
      pr:
        description: The pull request's number
        type: string
        required: true
      node-version:
        description: The Node version to build with, when the app has no .nvmrc or .node-version
        type: string
        default: lts/*
      up-workflow:
        description: The app's QA environment up workflow file, which the hand-over starts
        type: string
        default: qa-up.yml

permissions:
  contents: read

# bash with pipefail, so a script piped into tee fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # The pull request and its head commit, read from GitHub in a job of their own, where none of its code runs: the
  # build job is named after that commit, which is how qa-up knows, from GitHub's record of this run alone, which
  # commit a plan started on the default branch built.
  pr:
    name: QA pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Which pull request and commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::the pull request's number is not a number"; exit 1; }
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json number,headRefOid,isCrossRepository \
            --jq 'if .isCrossRepository then error("a pull request from a fork gets no QA environment") else "number=\(.number)\nsha=\(.headRefOid)" end' \
            >>"$GITHUB_OUTPUT"

  build:
    # qa-up finds this job by its name, deploys only when it succeeded, and takes the commit in its name for the
    # one built.
    name: QA build ${{ needs.pr.outputs.sha }}
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push replaces a build still running.
    concurrency:
      group: mroom-qa-plan-${{ inputs.pr }}
      cancel-in-progress: true
    # The job runs the pull request's code, and a run started by hand or by a wake runs under the default branch,
    # whose caches a workflow_dispatch may write: so it may only read them, or the pull request's code could leave
    # a poisoned cache for the default branch's own builds (design 8.2).
    cache-mode: read
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out mroom
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mroom
          persist-credentials: false
      # The pull request's files, as data: nothing of it runs before the paths are sorted.
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pr.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Sort the changed paths
        id: scope
        uses: ./mroom/actions/qa-plan
        with:
          pr: ${{ needs.pr.outputs.number }}
          config: app/mroom.toml
      - name: Say what the paths are
        env:
          SHA: ${{ needs.pr.outputs.sha }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: '{ echo "### QA plan for \`$SHA\`"; echo; echo "Paths: $SCOPE ($REASON)."; } >>"$GITHUB_STEP_SUMMARY"'
      - name: What to build
        id: build
        env:
          PR: ${{ needs.pr.outputs.number }}
        run: mroom/actions/qa-plan/build.sh settings "$PR" app | tee -a "$GITHUB_OUTPUT"
      - name: Node
        if: steps.build.outputs.dist != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.build.outputs.node_file == '' && inputs.node-version || '' }}
          node-version-file: ${{ steps.build.outputs.node_file != '' && format('app/{0}', steps.build.outputs.node_file) || '' }}
      # From here the pull request's own code runs: its packages' install scripts, then its build.
      - name: Build the frontend
        if: steps.build.outputs.dist != ''
        env:
          PR: ${{ needs.pr.outputs.number }}
        run: mroom/actions/qa-plan/build.sh run "$PR" app
      # qa-up downloads it from this run; to qa-up, the build is files to copy, never code to run.
      - name: Keep the build
        if: steps.build.outputs.dist != ''
        uses: actions/upload-artifact@v4
        with:
          name: mroom-qa-dist
          path: app/${{ steps.build.outputs.dist }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # A run the job token started (a wake's) ends without a workflow_run, so qa-up would never follow it: this job
  # starts the app's qa-up workflow on the default branch, naming this run, whose plan qa-up checks again with
  # GitHub before it trusts it. A run a person started gets its workflow_run as usual, so this job skips it. It
  # goes by the run's actor, the one who started its first attempt: a person's re-run of a woken plan is still the
  # job token's run, and nothing says its end starts a workflow_run, so it hands over again; should one start too,
  # qa-up deploys the same commit twice, which changes nothing.
  hand-over:
    name: QA hand-over
    needs: build
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to start the app's qa-up workflow
    steps:
      - name: Start qa-up for this plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          UP: ${{ inputs.up-workflow }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::the pull request's number is not a number"; exit 1; }
          [[ "$UP" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*\.ya?ml$ ]] || { echo "::error::up-workflow is not a workflow file name"; exit 1; }
          gh workflow run "$UP" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f pr="$PR" -f plan_run_id="$GITHUB_RUN_ID"
