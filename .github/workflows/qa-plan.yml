name: QA plan

# The half of a pull request's QA environment that runs the pull request's code, so it holds no secret (design
# 8.2). The app calls this workflow from one of its own on pull_request and workflow_dispatch (README, QA
# environments). It sorts the changed paths first (actions/qa-plan), before any of the pull request's code runs,
# and keeps that plan as the mroom-qa-plan artifact; then it builds the frontend for go-<N> with public values
# only (actions/qa-plan/build.sh) and keeps it as the mroom-qa-dist artifact. When this run completes, qa-up
# starts (workflow_run), which runs the default branch's workflow and mroom's actions at their pinned commit,
# takes the build as data to copy and sorts the paths again itself, since nothing a run of the pull request's code
# leaves can be trusted. Only qa-up uses the qa environment, which admits the default branch alone.
on:
  workflow_call:
    inputs:
      pr:
        description: The pull request's number
        type: string
        required: true
      node-version:
        description: The Node version to build with, when the app has no .nvmrc or .node-version
        type: string
        default: lts/*

permissions:
  contents: read

# bash with pipefail, so a script piped into tee fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  build:
    # qa-up finds this job by its name, and deploys only when it succeeded.
    name: QA build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push replaces a build still running.
    concurrency:
      group: mroom-qa-plan-${{ inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out mroom
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mroom
          persist-credentials: false
      - name: Which pull request and commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::the pull request's number is not a number"; exit 1; }
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json number,headRefOid,isCrossRepository \
            --jq 'if .isCrossRepository then error("a pull request from a fork gets no QA environment") else "number=\(.number)\nsha=\(.headRefOid)" end' \
            >>"$GITHUB_OUTPUT"
      # The pull request's files, as data: nothing of it runs before the plan is kept.
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Sort the changed paths
        id: scope
        uses: ./mroom/actions/qa-plan
        with:
          pr: ${{ steps.pr.outputs.number }}
          config: app/mroom.toml
      - name: Write the plan
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          mkdir -p "$RUNNER_TEMP/mroom-qa-plan"
          jq -n --argjson pr "$PR" --arg sha "$SHA" --arg scope "$SCOPE" --arg reason "$REASON" \
            '{pr: $pr, sha: $sha, scope: $scope, reason: $reason}' >"$RUNNER_TEMP/mroom-qa-plan/plan.json"
          { echo "### QA plan for \`$SHA\`"; echo; echo "Paths: $SCOPE ($REASON)."; } >>"$GITHUB_STEP_SUMMARY"
      - name: Keep the plan
        uses: actions/upload-artifact@v4
        with:
          name: mroom-qa-plan
          path: ${{ runner.temp }}/mroom-qa-plan/plan.json
          retention-days: 1
          if-no-files-found: error
      - name: What to build
        id: build
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: mroom/actions/qa-plan/build.sh settings "$PR" app | tee -a "$GITHUB_OUTPUT"
      - name: Node
        if: steps.build.outputs.dist != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.build.outputs.node_file == '' && inputs.node-version || '' }}
          node-version-file: ${{ steps.build.outputs.node_file != '' && format('app/{0}', steps.build.outputs.node_file) || '' }}
      # From here the pull request's own code runs: its packages' install scripts, then its build.
      - name: Build the frontend
        if: steps.build.outputs.dist != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: mroom/actions/qa-plan/build.sh run "$PR" app
      # qa-up downloads it from this run; to qa-up, the build is files to copy, never code to run.
      - name: Keep the build
        if: steps.build.outputs.dist != ''
        uses: actions/upload-artifact@v4
        with:
          name: mroom-qa-dist
          path: app/${{ steps.build.outputs.dist }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
