name: QA environment reap

# Every QA environment older than qa.ttl_days goes, with or without the qa label, since someone always forgets
# to close a pull request (design 8.2). The app calls this workflow from one of its own on a schedule and
# workflow_dispatch (README, QA environments), which run under the default branch, the only one the qa
# environment admits. It checks out only the default branch's mroom.toml, and mroom at the commit of this file.
# It tears nothing down itself: for each environment past its time it starts the app's qa-down workflow, whose
# teardown takes the pull request's concurrency group, wakes a waiting pull request when it frees a slot and can be
# re-run on its own. So it holds the Forge token, to read the environments and send a stuck delete again, and no
# SSH key. Until the qa environment has MROOM_FORGE_SERVER, there is nothing to reap.
on:
  workflow_call:
    inputs:
      down-workflow:
        description: The app's QA environment down workflow file, started for each environment past its time
        type: string
        default: qa-down.yml
    secrets:
      MROOM_FORGE_TOKEN:
        required: true

permissions:
  contents: read

# bash with pipefail, so a script piped into tee fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  reap:
    name: QA reap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: qa
      deployment: false
    # One reaper at a time; it takes no pull request's group, which its teardowns take each.
    concurrency:
      group: mroom-qa-reap
      cancel-in-progress: false
    permissions:
      actions: write # to start a teardown for each environment past its time
      contents: read
    steps:
      - name: Check out mroom
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mroom
          persist-credentials: false
      - name: Check out the app's mroom.toml
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app
          persist-credentials: false
          sparse-checkout: /mroom.toml
          sparse-checkout-cone-mode: false
      - name: Reap
        uses: ./mroom/actions/qa-reap
        with:
          config: app/mroom.toml
          down-workflow: ${{ inputs.down-workflow }}
          forge-org: ${{ vars.MROOM_FORGE_ORG }}
          forge-server: ${{ vars.MROOM_FORGE_SERVER }}
          forge-token: ${{ secrets.MROOM_FORGE_TOKEN }}
