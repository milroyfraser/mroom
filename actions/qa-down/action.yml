name: QA environment down
description: >-
  Tears down one pull request's QA environment, when Forge has one (design 8.2, 8.9): its daemons, its site
  user's processes and files (the gate's user-clean), its sites, then its database and role, Redis user and
  keys, mail login and mail, and buckets, through the gate. Then the pull request's QA environment comment says
  it was removed, and the slot it freed goes to the pull request that has waited longest. Run it only from a job
  in the qa environment that checks out the default branch alone (.github/workflows/qa-down.yml).
inputs:
  pr:
    description: The pull request's number, which is its environment's
    required: true
  why:
    description: Why it was removed, for the comment
    default: ""
  always:
    description: true to clear the box's side even when Forge has no site of the environment
    default: "false"
  config:
    description: The app's mroom.toml, checked out from the default branch
    default: mroom.toml
  plan-workflow:
    description: The app's QA plan workflow file, started for a pull request that waits for a slot
    default: qa-plan.yml
  forge-org:
    description: The Forge organisation
    required: true
  forge-server:
    description: The Forge server id of the box
    required: true
  forge-token:
    description: The qa environment's Forge token
    required: true
  ssh-host:
    description: The box's host name
    required: true
  ssh-user:
    description: The box user whose authorized_keys forces the gate on the key
    default: forge
  ssh-key:
    description: The private key the box forces to mroom gate provision
    required: true
  ssh-known-hosts:
    description: The box's host key line
    required: true
  github-token:
    description: A token that may write pull request comments and start workflows
    default: ${{ github.token }}
outputs:
  freed:
    description: true when the environment held a slot that is now free
    value: ${{ steps.down.outputs.freed }}
runs:
  using: composite
  steps:
    - id: down
      name: Tear down the QA environment
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        WHY: ${{ inputs.why }}
        ALWAYS: ${{ inputs.always }}
        MROOM_CONFIG: ${{ inputs.config }}
        MROOM_QA_PLAN_WORKFLOW: ${{ inputs.plan-workflow }}
        MROOM_QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        MROOM_FORGE_ORG: ${{ inputs.forge-org }}
        MROOM_FORGE_SERVER: ${{ inputs.forge-server }}
        MROOM_FORGE_TOKEN: ${{ inputs.forge-token }}
        MROOM_QA_SSH_HOST: ${{ inputs.ssh-host }}
        MROOM_QA_SSH_USER: ${{ inputs.ssh-user }}
        MROOM_QA_SSH_KEY: ${{ inputs.ssh-key }}
        MROOM_QA_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(--wake)
        if [ "$ALWAYS" = true ]; then args+=(--always); fi
        if [ -n "$WHY" ]; then args+=(--why "$WHY"); fi
        "$GITHUB_ACTION_PATH/down.sh" "$PR" "${args[@]}"
