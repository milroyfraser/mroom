name: QA plan
description: >-
  The path rules of the QA plan (design 8.2): could a user notice this pull request? Lists its changed files,
  a renamed file's old name too, through GitHub's API and answers scope (none, or maybe) and why, from mroom.toml's
  qa.visible_paths and qa.hidden_paths and mroom's own rules (plan.sh, scope.sh). It reads the pull request as data
  and runs none of its code.
inputs:
  pr:
    description: The pull request's number
    required: true
  config:
    description: The app's mroom.toml
    default: mroom.toml
  github-token:
    description: A token that may read the pull request
    default: ${{ github.token }}
outputs:
  scope:
    description: none when no user could notice the change, else maybe
    value: ${{ steps.scope.outputs.scope }}
  reason:
    description: The areas the changed paths are in, and how many of them each
    value: ${{ steps.scope.outputs.reason }}
runs:
  using: composite
  steps:
    - id: scope
      name: Sort the changed paths
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        MROOM_CONFIG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: '"$GITHUB_ACTION_PATH/plan.sh" "$PR" | tee -a "$GITHUB_OUTPUT"'
